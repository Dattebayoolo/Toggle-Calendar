<svg width="880" height="240" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toggle Calendar banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#01411c"/>
      <stop offset="50%" stop-color="#057a3e"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ▼ Logo artwork from icons/icon-192.svg (IDs prefixed ico- to stay unique) -->
    <linearGradient id="ico-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c0e"/>
      <stop offset="50%" stop-color="#01411c"/>
      <stop offset="100%" stop-color="#065f2c"/>
    </linearGradient>
    <linearGradient id="ico-metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="ico-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="ico-cardClip">
      <rect x="24" y="32" width="144" height="136" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="880" height="240" rx="18" fill="url(#bg)"/>
  <rect width="880" height="240" rx="18" fill="url(#shine)"/>
  <circle cx="800" cy="30" r="90" fill="#ffffff" opacity="0.04"/>
  <circle cx="70" cy="220" r="120" fill="#000000" opacity="0.15"/>

  <!-- Logo (icons/icon-192.svg) -->
  <g transform="translate(52, 46) scale(0.77)">
    <rect width="192" height="192" rx="42" fill="url(#ico-bgGrad)"/>
    <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <g filter="url(#ico-shadow)">
      <rect x="58" y="24" width="10" height="18" rx="5" fill="url(#ico-metalRing)"/>
      <rect x="124" y="24" width="10" height="18" rx="5" fill="url(#ico-metalRing)"/>
      <g clip-path="url(#ico-cardClip)">
        <rect x="24" y="32" width="36" height="136" fill="#ffffff"/>
        <rect x="60" y="32" width="108" height="136" fill="#01411c"/>
        <rect x="24" y="32" width="144" height="28" fill="rgba(0,0,0,0.18)"/>
        <g transform="translate(114, 102)">
          <path d="M 0 -28 A 28 28 0 1 0 28 12 A 22 22 0 1 1 -5 -27 Z" fill="#ffffff"/>
          <g transform="translate(13, -12) rotate(-35)">
            <polygon points="0,-9 2.7,-2.8 9.3,-2.8 4,1.1 6,7.5 0,3.6 -6,7.5 -4,1.1 -9.3,-2.8 -2.7,-2.8" fill="#ffffff"/>
          </g>
        </g>
        <rect x="74" y="142" width="44" height="16" rx="8" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <circle cx="106" cy="150" r="6" fill="#ffffff"/>
        <path d="M 82 150 L 92 150" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Title -->
  <text x="240" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Toggle Calendar</text>
  <text x="244" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#a7f3d0">Pakistan's first culturally-aware scheduling platform</text>

  <!-- Tagline chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="244" y="176" width="120" height="30" rx="15" fill="rgba(255,255,255,0.12)"/>
    <text x="304" y="196" fill="#ffffff" text-anchor="middle">🌙 Hijri</text>
    <rect x="376" y="176" width="140" height="30" rx="15" fill="rgba(255,255,255,0.12)"/>
    <text x="446" y="196" fill="#ffffff" text-anchor="middle">🕌 Prayer Times</text>
    <rect x="528" y="176" width="180" height="30" rx="15" fill="rgba(255,255,255,0.12)"/>
    <text x="618" y="196" fill="#ffffff" text-anchor="middle">🤲 Jummah Protection</text>
  </g>
</svg>
